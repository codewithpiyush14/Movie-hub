<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details — MovieHub</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="movie-details.css">
</head>

<body class="bg-slate-50 text-slate-900 selection:bg-red-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Ambient Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-6xl h-96 bg-gradient-to-tr from-red-200/30 via-rose-100/20 to-amber-100/30 blur-3xl -z-10 pointer-events-none rounded-full"></div>

    <!-- Glassmorphism Navbar -->
    <header class="border-b border-slate-200/80 bg-white/70 backdrop-blur-md sticky top-0 z-50 shadow-xs">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- Back Button -->
            <a href="INDEX.HTML" class="inline-flex items-center gap-2 text-sm font-bold text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 px-4 py-2.5 rounded-xl transition-all shadow-2xs hover:shadow-md hover:-translate-x-0.5">
                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Back to Search</span>
            </a>

            <!-- Brand Logo -->
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-red-600 flex items-center justify-center text-white shadow-sm shadow-red-500/30">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v3h2.5l1.5-3H4zm4.5 0l-1.5 3h3l1.5-3H8.5zm5 0l-1.5 3h3l1.5-3h-3zm5 0l-1.5 3H20V6h-1.5zM4 11v7h16v-7H4z" />
                    </svg>
                </div>
                <span class="text-lg font-extrabold tracking-tight text-slate-900">Movie<span class="text-red-600">Hub</span></span>
            </div>

            <!-- Placeholder for symmetry -->
            <div class="hidden sm:block w-28 text-right">
                <span class="text-xs font-semibold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full border border-slate-200">Details View</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 py-12 flex-grow w-full">
        <div id="movie-detail">
            <!-- JS dynamically injects movie details here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white/80 backdrop-blur-md py-6">
        <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500 font-medium">
            <p>© MovieHub — All movie information provided by OMDb API</p>
            <a href="INDEX.HTML" class="text-xs font-bold text-red-600 hover:underline">← Search Another Title</a>
        </div>
    </footer>

    <script src="movie-details.js"></script>
</body>

</html>
